vscode-diffEditor-insertedTextBorder:#33ff2eff;--vscode-diffEditor-removedTextBorder:#ff008f}body{background:var(--vscode-editor-background);color:var(--vscode-foreground)}:root {
  font-family: "IBM Plex Sans", "Avenir Next", sans-serif;
  --line: var(--vscode-contrastBorder, var(--vscode-panel-border, #cccccc));
  --panel: var(--vscode-editorWidget-background, #f3f3f3);
  --ink: var(--vscode-foreground, #333333);
  --accent: var(--vscode-contrastActiveBorder, var(--vscode-focusBorder, #007acc));
  --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  color: var(--ink);
  background: var(--vscode-editor-background, #ffffff);
}

button,
input {
  font: inherit;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

.app-shell {
  display: grid;
  grid-template-columns: 260px minmax(700px, 1fr) 280px;
  grid-template-rows: 1fr 170px;
  height: 100%;
  gap: 10px;
  padding: 10px;
}

.pane,
.center-pane,
.console-pane {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
}

.pane {
  padding: 12px;
  overflow: auto;
}

.pane h2 {
  margin: 0 0 10px;
  font-size: 13px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--vscode-editorWidget-foreground, var(--vscode-foreground, #555555));
}

.tool-grid {
  display: grid;
  gap: 6px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-bottom: 14px;
}

.tool-grid button,
.object-list button,
.action-row button,
.field-chip {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--vscode-input-background, #ffffff);
  color: var(--vscode-input-foreground, #333333);
  cursor: pointer;
  padding: 6px 8px;
}

.tool-grid button:hover,
.object-list button:hover,
.action-row button:hover,
.field-chip:hover {
  border-color: var(--accent);
}

.field-chip {
  width: 100%;
  text-align: left;
  overflow-wrap: anywhere;
}

.center-pane {
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 10px;
  overflow: hidden;
}

.canvas-header {
  display: grid;
  gap: 8px;
}

.canvas-header h1 {
  margin: 0;
  font-size: 16px;
}

.canvas-header p {
  margin: 2px 0 0;
  color: var(--vscode-editorWidget-foreground, var(--vscode-foreground, #555555));
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-bottom: 4px;
}

.action-row select {
  min-width: 0;
  max-width: 100%;
  font: inherit;
}

.canvas-scroll {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--vscode-editor-background, #ffffff);
  overflow: auto;
  padding: 16px;
  position: relative;
}

.design-surface {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 10px;
  background-image: linear-gradient(to right, color-mix(in srgb, var(--accent) 18%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb, var(--accent) 18%, transparent) 1px, transparent 1px);
  overflow: hidden;
  user-select: none;
}

.interaction-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.object-hitbox {
  position: absolute;
  border: 1px solid transparent;
  border-radius: 6px;
  pointer-events: auto;
  cursor: move;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}

.object-hitbox:hover {
  border-color: var(--accent);
}

.object-hitbox.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.object-hitbox.grouped {
  background: var(--accent-soft);
}

.object-name {
  position: absolute;
  left: 4px;
  top: -18px;
  font-size: 10px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 6px;
  pointer-events: none;
}

.resize-handle {
  position: absolute;
  width: 10px;
  height: 10px;
  border: 1px solid var(--vscode-input-background, #ffffff);
  border-radius: 2px;
  background: var(--accent);
  padding: 0;
  pointer-events: auto;
}

.resize-handle.handle-nw {
  left: -6px;
  top: -6px;
  cursor: nwse-resize;
}

.resize-handle.handle-ne {
  right: -6px;
  top: -6px;
  cursor: nesw-resize;
}

.resize-handle.handle-sw {
  left: -6px;
  bottom: -6px;
  cursor: nesw-resize;
}

.resize-handle.handle-se {
  right: -6px;
  bottom: -6px;
  cursor: nwse-resize;
}

.guide-line {
  position: absolute;
  background: var(--accent);
  pointer-events: none;
}

.guide-line.vertical {
  top: 0;
  bottom: 0;
  width: 1px;
}

.guide-line.horizontal {
  left: 0;
  right: 0;
  height: 1px;
}

.marquee {
  position: absolute;
  border: 1px dashed var(--accent);
  background: var(--accent-soft);
  pointer-events: none;
}

.object-list {
  margin-top: 8px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.object-list button.selected {
  background: var(--vscode-list-hoverBackground, #e8e8e8);
  border-color: var(--accent);
}

.field-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  /* One column that may shrink: without minmax(0, ...) a very long field name sets the column (and the page) width. */
  grid-template-columns: minmax(0, 1fr);
  gap: 4px;
}

.field-list li {
  min-width: 0;
  padding: 0;
  border-radius: 5px;
  font-size: 12px;
}

.inspector-field {
  display: grid;
  gap: 6px;
  margin-bottom: 14px;
}

.inspector-field input {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  background: var(--vscode-input-background, #ffffff);
}

.inspector-field select {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  background: var(--vscode-input-background, #ffffff);
  color: var(--vscode-input-foreground, #333333);
}

.inspector-field button {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--vscode-input-background, #ffffff);
  color: var(--vscode-input-foreground, #333333);
  cursor: pointer;
  padding: 6px 8px;
}

.inspector-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink);
}

.inspector-check input {
  width: 14px;
  height: 14px;
  margin: 0;
}

.portal-column-editor {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 8px;
  display: grid;
  gap: 8px;
}

.portal-column-dropzone {
  border: 1px dashed var(--accent);
  border-radius: 6px;
  padding: 8px;
  text-align: center;
  font-size: 12px;
  color: var(--ink);
  background: var(--panel);
}

.portal-field-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.portal-field-chip {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 8px;
  background: var(--vscode-input-background, #ffffff);
  color: var(--ink);
  cursor: pointer;
  font-size: 12px;
}

.portal-column-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}

.portal-column-row {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--vscode-input-background, #ffffff);
  padding: 6px;
  display: grid;
  gap: 6px;
}

.portal-column-main {
  display: grid;
  gap: 2px;
  font-size: 12px;
}

.portal-column-main strong {
  color: var(--vscode-input-foreground, #333333);
}

.portal-column-main span {
  color: var(--vscode-editorWidget-foreground, var(--vscode-foreground, #555555));
}

.portal-column-actions {
  display: flex;
  gap: 6px;
}

.portal-column-actions button {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--vscode-input-background, #ffffff);
  color: var(--vscode-input-foreground, #333333);
  cursor: pointer;
  padding: 4px 6px;
  font-size: 11px;
}

.inspector-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  font-size: 12px;
  color: var(--ink);
}

.muted {
  color: var(--vscode-editorWidget-foreground, var(--vscode-foreground, #555555));
  font-style: italic;
  margin: 0;
}

.console-pane {
  grid-column: 1 / 4;
  padding: 10px;
  display: grid;
  gap: 8px;
}

.console-log {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--vscode-editor-background, #ffffff);
  min-height: 110px;
  max-height: 120px;
  overflow: auto;
  font-family: "JetBrains Mono", "SFMono-Regular", monospace;
  font-size: 11px;
  padding: 8px;
}

/* Narrower editors: the three columns need about 1,300 px. Below that the side panes shrink, and in a
   narrow editor everything stacks in one column that scrolls (toolbars already wrap). */
@media (max-width: 1320px) {
  .app-shell {
    grid-template-columns: 220px minmax(0, 1fr) 240px;
  }
}

@media (max-width: 860px) {
  html,
  body,
  #root {
    height: auto;
    min-height: 100%;
  }

  .app-shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto;
    height: auto;
  }

  .console-pane {
    grid-column: auto;
  }

  .center-pane {
    min-height: 420px;
  }

  .pane {
    overflow: visible;
  }

  .canvas-header h1,
  .canvas-header p {
    overflow-wrap: anywhere;
  }

  .inspector-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Version footer from the extension host (FileMaker: About / Show Version). Lives here because the
   packaged Layout Mode stylesheet is this bundle, not the extension's fallback copy. */
.fm-version {
  position: fixed;
  right: 8px;
  bottom: 4px;
  font-size: 11px;
  color: var(--ink);
  pointer-events: none;
}

/* Paper belongs to the page being designed; only the surrounding chrome is themed.
   Keep its grid above the authored page, whose surface otherwise covers it. */
.design-surface { background-color: #ffffff; }
.interaction-layer { background-image: inherit; background-size: inherit; }
:root { --border: var(--line); }
.inspector-field input, .action-row select {
  color: var(--vscode-input-foreground, #333333);
}

/* Theme colors are paired; HC outlines do not change control geometry. */
input, select, textarea {
  background: var(--vscode-input-background, #ffffff);
  color: var(--vscode-input-foreground, #333333);
  border-color: var(--vscode-contrastBorder, var(--vscode-input-border, var(--border)));
  accent-color: var(--vscode-focusBorder, #007acc);
}
button, summary {
  outline: 1px solid var(--vscode-contrastBorder, transparent);
}
button:hover, summary:hover {
  outline-color: var(--vscode-contrastActiveBorder, var(--vscode-contrastBorder, transparent));
}
input:focus-visible, select:focus-visible, textarea:focus-visible,
button:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--vscode-contrastActiveBorder, var(--vscode-focusBorder, #007acc));
  outline-offset: 1px;
}
a:any-link { color: var(--vscode-textLink-foreground, #005fb8); }

/* Native placeholder defaults are OS-dependent; keep hints readable. */
input::placeholder, textarea::placeholder {
  color: var(--vscode-input-foreground, #333333);
  opacity: 1;
}
