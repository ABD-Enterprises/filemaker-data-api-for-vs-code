<!doctype html><html><head><meta charset="utf-8"><title>diagnostics high-contrast</title><style>:root{--vscode-foreground:#ffffff;--vscode-descriptionForeground:#ffffffb3;--vscode-editorWidget-background:#0c141f;--vscode-input-background:#000000;--vscode-button-background:#000000;--vscode-button-hoverBackground:#000000;--vscode-list-hoverBackground:#ffffff1a;--vscode-focusBorder:#f38518;--vscode-contrastBorder:#6fc3df;--vscode-contrastActiveBorder:#f38518;--vscode-errorForeground:#f48771;--vscode-textLink-foreground:#21a6ff;--vscode-inputValidation-infoBackground:#000000;--vscode-inputValidation-warningBackground:#000000;--vscode-inputValidation-errorBackground:#000000;--vscode-editorWarning-foreground:#ffd370;--vscode-textCodeBlock-background:#000000;--vscode-sideBar-background:#000000;--vscode-textBlockQuote-background:#000000;--vscode-editor-background:#000000;--vscode-editor-foreground:#FFFFFF;--vscode-browser-border:#00000000;--vscode-editorIndentGuide-background1:#FFFFFF;--vscode-editorIndentGuide-activeBackground1:#FFFFFF;--vscode-sideBarTitle-foreground:#FFFFFF;--vscode-selection-background:#008000;--vscode-editor-selectionBackground:#FFFFFF;--vscode-titleBar-inactiveBackground:#000000;--vscode-statusBar-inactiveBackground:#000000;--vscode-statusBarItem-remoteBackground:#00000000;--vscode-ports-iconRunningProcessForeground:#FFFFFF;--vscode-editorWhitespace-foreground:#7c7c7c;--vscode-actionBar-toggledBackground:#383a49;--vscode-button-foreground:#ffffff;--vscode-button-secondaryForeground:#ffffff;--vscode-input-foreground:#ffffff;--vscode-editorWidget-foreground:#ffffff;--vscode-panel-border:#6fc3df;--vscode-testing-iconPassed:#73c991;--vscode-progressBar-background:#6fc3df;--vscode-widget-shadow:#000000;--vscode-disabledForeground:#a5a5a5;--vscode-inputOption-activeBackground:#00000000;--vscode-inputValidation-infoBorder:#6fc3df;--vscode-inputValidation-warningBorder:#6fc3df;--vscode-inputValidation-errorBorder:#6fc3df;--vscode-textBlockQuote-border:#6fc3df;--vscode-diffEditor-insertedTextBorder:#33ff2eff;--vscode-diffEditor-removedTextBorder:#ff008f}body{background:var(--vscode-editor-background);color:var(--vscode-foreground)}
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--vscode-editor-background, #ffffff); color: var(--vscode-foreground, #333333); }
    .wrap { padding: 16px; display: grid; gap: 14px; min-width: 0; }
    .card { background: var(--vscode-editorWidget-background, #f3f3f3); border: 1px solid var(--vscode-contrastBorder, var(--vscode-panel-border, #cccccc)); border-radius: 10px; padding: 12px; min-width: 0; }
    .table-scroll { overflow-x: auto; max-width: 100%; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 8px; }
    .stat { border: 1px solid var(--vscode-contrastBorder, var(--vscode-panel-border, #cccccc)); border-radius: 8px; padding: 8px; }
    .label { color: var(--vscode-editorWidget-foreground, var(--vscode-foreground, #555555)); font-size: 12px; }
    .value { font-weight: 700; font-size: 18px; margin-top: 4px; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--vscode-contrastBorder, var(--vscode-panel-border, #cccccc)); text-align: left; padding: 6px 8px; font-size: 12px; }
    th { background: var(--vscode-editor-background, #ffffff); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    button { border: none; border-radius: 6px; background: var(--vscode-button-background, #007acc); color: var(--vscode-button-foreground, #ffffff); padding: 7px 10px; cursor: pointer; }
    button:hover { background: var(--vscode-button-hoverBackground, #0062a3); }
    .muted { color: var(--vscode-editorWidget-foreground, var(--vscode-foreground, #555555)); }
    .fm-version { color: var(--vscode-editorWidget-foreground, var(--vscode-foreground, #555555)); font-size: 11px; padding: 0 16px 12px; }

    button { outline: 1px solid var(--vscode-contrastBorder, transparent); }
    button:focus-visible { outline: 2px solid var(--vscode-contrastActiveBorder, var(--vscode-focusBorder, #007acc)); outline-offset: 1px; }
</style></head><body class="vscode-high-contrast"><div class="container"><section class="card"><h1>Diagnostics</h1><div class="stat"><p class="label">Requests</p><p>42</p></div><button>Refresh</button><p class="muted">No errors</p><table><tr><th>Profile</th></tr><tr><td>Customers</td></tr></table></section></div><footer class="fm-version">FileMaker v1.6.0</footer></body></html>
