--vscode-diffEditor-insertedTextBorder:#33ff2eff;--vscode-diffEditor-removedTextBorder:#ff008f}body{background:var(--vscode-editor-background);color:var(--vscode-foreground)}:root {
  --bg: var(--vscode-editor-background, #f8fafc);
  --panel: var(--vscode-editorWidget-background, #f3f3f3);
  --text: var(--vscode-editor-foreground, #111827);
  --muted: var(--vscode-foreground, #5b6472);
  --border: var(--vscode-contrastBorder, var(--vscode-panel-border, #cccccc));
  --accent: var(--vscode-button-background, #1f6feb);
  --accent-text: var(--vscode-button-foreground, #ffffff);
  --added: var(--vscode-diffEditor-insertedTextBorder, var(--vscode-gitDecoration-addedResourceForeground, #137333));
  --added-bg: var(--vscode-diffEditor-insertedTextBackground, var(--vscode-editor-background, #e6f4ea));
  --removed: var(--vscode-diffEditor-removedTextBorder, var(--vscode-gitDecoration-deletedResourceForeground, #b3261e));
  --removed-bg: var(--vscode-diffEditor-removedTextBackground, var(--vscode-editor-background, #fce8e6));
  --changed: var(--vscode-inputValidation-warningBorder, #9a6700);
  --changed-bg: var(--vscode-inputValidation-warningBackground, #fff4ce);
  --unchanged-bg: var(--vscode-editorWidget-background, #f6f8fa);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--vscode-font-family, 'Segoe UI', sans-serif);
  font-size: var(--vscode-font-size, 13px);
}

.container {
  max-width: min(1320px, 96vw);
  margin: 0 auto;
  padding: 20px;
  display: grid;
  gap: 14px;
}

section,
header {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}

h1,
h2 {
  margin: 0 0 8px;
  font-size: 1.2rem;
  letter-spacing: 0;
}

p {
  margin: 0;
  color: var(--muted);
}

.summary {
  margin-top: 8px;
  font-weight: 600;
}

.actions {
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.mode-switch {
  display: inline-flex;
  gap: 2px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
}

button {
  border: none;
  border-radius: 6px;
  padding: 7px 10px;
  background: transparent;
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
}

button.active,
#exportButton {
  background: var(--accent);
  color: var(--accent-text);
}

.filter-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
}

.diff-section {
  opacity: 0;
  transition: opacity 0.15s ease-in;
}

.diff-section.loaded {
  opacity: 1;
}

.loading-skeleton {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.loading-skeleton .skeleton-line {
  height: 16px;
  background: var(--vscode-editor-inactiveSelectionBackground, rgba(208, 215, 222, 0.9));
  border-radius: 4px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}

.loading-skeleton .skeleton-line.short {
  width: 40%;
}

.loading-skeleton .skeleton-line.medium {
  width: 65%;
}

.loading-skeleton .skeleton-line.long {
  width: 90%;
}

@keyframes skeleton-pulse {
  0%,
  100% {
    opacity: 0.4;
  }

  50% {
    opacity: 1;
  }
}

.loading-skeleton.hidden {
  display: none;
}

.side-by-side-grid {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr);
  gap: 8px;
}

.column-header {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  font-weight: 700;
}

.field-cell {
  min-height: 86px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  overflow-wrap: anywhere;
}

.field-cell.added,
.tree-leaf.added {
  border-color: var(--added);
  background: var(--added-bg);
}

.field-cell.removed,
.tree-leaf.removed {
  border-color: var(--removed);
  background: var(--removed-bg);
}

.field-cell.changed,
.tree-leaf.changed {
  border-color: var(--changed);
  background: var(--changed-bg);
}

.field-cell.unchanged,
.tree-leaf.unchanged {
  background: var(--unchanged-bg);
}

.field-title {
  margin-bottom: 8px;
  font-family: var(--vscode-editor-font-family, monospace);
  font-weight: 700;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  min-height: 20px;
  margin: 0 0 8px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--unchanged-bg);
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
}

.status-badge.added {
  color: var(--text);
  box-shadow: inset 0 -2px var(--added);
}

.status-badge.removed {
  color: var(--text);
  box-shadow: inset 0 -2px var(--removed);
}

.status-badge.changed {
  color: var(--text);
  box-shadow: inset 0 -2px var(--changed);
}

.field-meta {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 4px 10px;
  margin: 0;
  color: var(--muted);
}

.field-meta dt {
  font-weight: 700;
}

.field-meta dd {
  margin: 0;
  font-family: var(--vscode-editor-font-family, monospace);
}

.schema-tree-root {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
}

.schema-tree-root > summary {
  cursor: pointer;
  font-weight: 700;
}

.tree-count {
  margin-left: 10px;
  color: var(--muted);
  font-weight: 500;
}

.schema-tree {
  display: grid;
  gap: 8px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}

.tree-leaf {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto minmax(80px, 0.35fr);
  align-items: start;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px;
}

.tree-field-name,
.tree-field-type {
  font-family: var(--vscode-editor-font-family, monospace);
}

.tree-field-type {
  color: var(--muted);
}

.change-list {
  grid-column: 1 / -1;
  margin: 6px 0 0 18px;
  padding: 0;
  color: var(--muted);
}

.empty {
  color: var(--muted);
}

@media (max-width: 760px) {
  .container {
    padding: 12px;
  }

  .side-by-side-grid,
  .tree-leaf {
    grid-template-columns: 1fr;
  }
}

.fm-version {
  margin: 12px 16px;
  font-size: 11px;
  color: var(--vscode-descriptionForeground, #5f6c7b);
}

/* Diff tint may sit over the editor widget. Use editor text for readable metadata
   and paired validation colors for warning cells. Labels also name each status. */
.field-cell, .tree-leaf { color: var(--text); }
.field-cell .field-meta, .tree-leaf .tree-field-type, .tree-leaf .change-list { color: inherit; }
.field-cell.changed, .tree-leaf.changed {
  color: var(--vscode-inputValidation-warningForeground, var(--text));
}

/* Theme colors are paired; HC outlines do not change control geometry. */
input, select, textarea {
  background: var(--vscode-input-background, #ffffff);
  color: var(--vscode-input-foreground, #333333);
  border-color: var(--vscode-contrastBorder, var(--vscode-input-border, var(--border)));
  accent-color: var(--vscode-focusBorder, #007acc);
}
button, summary {
  outline: 1px solid var(--vscode-contrastBorder, transparent);
}
button:hover, summary:hover {
  outline-color: var(--vscode-contrastActiveBorder, var(--vscode-contrastBorder, transparent));
}
input:focus-visible, select:focus-visible, textarea:focus-visible,
button:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--vscode-contrastActiveBorder, var(--vscode-focusBorder, #007acc));
  outline-offset: 1px;
}
a:any-link { color: var(--vscode-textLink-foreground, #005fb8); }

/* Native placeholder defaults are OS-dependent; keep hints readable. */
input::placeholder, textarea::placeholder {
  color: var(--vscode-input-foreground, #333333);
  opacity: 1;
}
