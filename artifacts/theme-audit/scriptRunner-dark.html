  --bg: var(--vscode-editor-background, #ffffff);
  --panel: var(--vscode-editorWidget-background, #f3f3f3);
  --text: var(--vscode-foreground, #333333);

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Avenir Next', 'Segoe UI', sans-serif;
  font-size: clamp(0.8rem, 0.85rem + 0.1vw, 0.95rem);
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: min(1100px, 95vw);
  margin: 0 auto;
  padding: clamp(12px, 2vw, 24px);
  display: grid;
  gap: 16px;
}

.header h1 {
  margin: 0;
  font-size: clamp(1.1rem, 1.2rem + 0.15vw, 1.5rem);
}

.header p {
  margin: 5px 0 0;
  color: var(--muted);
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(12px, 2vw, 24px);
}

.hidden {
  display: none !important;
}

.row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}

.row.inline {
  flex-direction: row;
  align-items: center;
}

label {
  font-size: clamp(0.8rem, 0.85rem + 0.1vw, 0.95rem);
  color: var(--muted);
}

select,
input,
textarea {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: clamp(0.8rem, 0.85rem + 0.1vw, 0.95rem);
}

textarea {
  resize: vertical;
}

.parameter-input-group {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: start;
}

.parameter-input-group textarea {
  min-width: 0;
}

.builder-panel {
  margin: 10px 0;
  padding: 14px;
  border-radius: 8px;
  background: var(--vscode-editorWidget-background, #f3f3f3);
}

.builder-panel h2 {
  margin: 0 0 10px;
  font-size: 1rem;
}

.builder-rows {
  display: grid;
  gap: 10px;
}

.builder-row {
  display: grid;
  grid-template-columns: minmax(120px, 1fr) minmax(110px, 140px) minmax(160px, 2fr) auto;
  gap: 8px;
  align-items: end;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--vscode-editor-background, #ffffff);
}

.builder-field {
  display: grid;
  gap: 4px;
  min-width: 0;
}

.builder-field textarea {
  min-height: 36px;
}

.builder-json-value {
  min-height: 94px;
}

.builder-toolbar,
.builder-actions {
  margin-top: 10px;
}

.parameter-preview {
  min-height: 84px;
  margin: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  overflow: auto;
  background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background, #ffffff));
  color: var(--vscode-editor-foreground, #333333);
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: var(--vscode-button-foreground, #ffffff);
  font-weight: 600;
  padding: 8px 12px;
  cursor: pointer;
}

button:hover {
  background: var(--accent-strong);
}

button.secondary {
  background: var(--vscode-button-secondaryBackground, var(--vscode-editor-background, #ffffff));
  color: var(--vscode-button-secondaryForeground, #333333);
}

button.secondary:hover {
  background: var(--vscode-button-secondaryHoverBackground, var(--vscode-list-hoverBackground, var(--vscode-editor-background, #ffffff)));
  color: var(--vscode-button-secondaryForeground, #333333);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

.status {
  margin: 10px 0 0;
  color: var(--muted);
}

.status.error {
  color: var(--error);
  font-weight: 600;
}

.summary {
  color: var(--muted);
  margin-bottom: 8px;
}

.summary.error {
  color: var(--error);
  font-weight: 600;
}

.loading-skeleton {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.loading-skeleton .skeleton-line {
  height: 16px;
  background: var(--vscode-editor-inactiveSelectionBackground, rgba(208, 215, 222, 0.9));
  border-radius: 4px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}

.loading-skeleton .skeleton-line.short {
  width: 40%;
}

.loading-skeleton .skeleton-line.medium {
  width: 65%;
}

.loading-skeleton .skeleton-line.long {
  width: 90%;
}

@keyframes skeleton-pulse {
  0%,
  100% {
    opacity: 0.4;
  }

  50% {
    opacity: 1;
  }
}

.loading-skeleton.hidden {
  display: none;
}

.raw {
  background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background, #ffffff));

  border-radius: 8px;
  padding: 10px;
  max-height: 320px;
  overflow: auto;
}

@media (max-width: 700px) {

.fm-version {

/* The "Copy request" dropdown, built on <details> */
details.menu {
  position: relative;
}

details.menu > summary {
  list-style: none;
  user-select: none;
  display: inline-block;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 600;
  background: var(--vscode-button-secondaryBackground, var(--vscode-editor-background, #ffffff));
  color: var(--vscode-button-secondaryForeground, #333333);
}

details.menu > summary::-webkit-details-marker {
  display: none;
}

details.menu > summary::after {
  content: ' ▾';
}

.menu-items {
  position: absolute;
  z-index: 10;
  top: calc(100% + 4px);
  left: 0;
  min-width: 220px;
  max-width: min(320px, calc(100vw - 32px));
  display: flex;
  flex-direction: column;
  padding: 4px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px var(--vscode-widget-shadow, rgba(0, 0, 0, 0.2));
}

.menu-items button {
  background: none;
  color: inherit;
  text-align: left;
  font-weight: normal;
  padding: 5px 10px;
  white-space: normal;
}

.menu-items button:hover:not(:disabled),
.menu-items button:focus-visible {
  background: var(--vscode-button-secondaryBackground, var(--vscode-editor-background, #ffffff));
  color: var(--vscode-button-secondaryForeground, #333333);
}

/* A closed menu has no boxes at all (nothing to overflow or cover), and on a narrow panel an open one
   opens in the flow of the page instead of floating over it. */
details.menu:not([open]) > .menu-items {
  display: none;
}

@media (max-width: 700px) {
  details.menu[open] {
    flex: 1 0 100%;
  }

  /* Bound to the window, not to the page: a page that a wide control stretches must not stretch the menu. */
  details.menu > .menu-items {
    position: static;
    width: min(100%, calc(100vw - 48px));
    min-width: 0;
    max-width: none;
    margin-top: 6px;
    box-shadow: none;
  }
}

/* Narrow editors (a split editor, a narrow window, high zoom): nothing is wider than the panel.

input:not([type='checkbox']):not([type='radio']),
textarea {
  max-width: 100%;
  min-width: 0;
}

select {
  width: 100%;
  text-overflow: ellipsis;
}

.container,
.panel,
.row,
.field,

  background: var(--vscode-input-background, #ffffff);

    <header class="header">
      <h1>FileMaker Script Runner</h1>

    <section class="panel">
      <div class="row">

      </div>
      <section id="parameterBuilderPanel" class="panel builder-panel" aria-labelledby="parameterBuilderTitle">

        </div>

      </section>
      <div class="row inline">

      </div>
      <div class="actions">
        <button id="runButton">Run Script</button>
        <details class="menu" id="copyRequestMenu">
          <summary class="secondary">Copy request</summary>
          <div class="menu-items">

            <button id="copyFetchButton" type="button" data-copy-format="fetch">Copy as fetch()</button>
            <button id="copyHttpButton" type="button" data-copy-format="http">Copy as .http (REST Client)</button>
