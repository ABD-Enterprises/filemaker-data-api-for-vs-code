eme so the builder matches light, dark and high-contrast themes. */
:root {
  --bg: var(--vscode-editor-background, #f4f6f8);
  --panel: var(--vscode-sideBar-background, var(--vscode-editor-background, #ffffff));
  --text: var(--vscode-foreground, #1f2933);
  --muted: var(--vscode-foreground, #5f6c7b);
  --accent: var(--vscode-button-background, #0f766e);
  --accent-text: var(--vscode-button-foreground, #ffffff);
  --accent-strong: var(--vscode-button-hoverBackground, #115e59);
  --secondary: var(--vscode-button-secondaryBackground, var(--vscode-editor-background, #ffffff));
  --secondary-text: var(--vscode-button-secondaryForeground, #1f2933);
  --secondary-hover: var(--vscode-button-secondaryHoverBackground, var(--vscode-list-hoverBackground, var(--vscode-editor-background, #ffffff)));
  --border: var(--vscode-contrastBorder, var(--vscode-panel-border, var(--vscode-widget-border, #d0d7de)));
  --input-bg: var(--vscode-input-background, #ffffff);
  --input-text: var(--vscode-input-foreground, #1f2933);
  --input-border: var(--vscode-input-border, var(--border));
  --focus: var(--vscode-focusBorder, #0f766e);
  --link: var(--vscode-textLink-foreground, #0f766e);
  --error: var(--vscode-errorForeground, #b42318);
  --row-hover: var(--vscode-list-hoverBackground, rgba(15, 118, 110, 0.06));
  --header-bg: var(--vscode-editorWidget-background, #f8fafc);
  --mono: var(--vscode-editor-font-family, 'SF Mono', Menlo, monospace);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--vscode-font-family, 'Segoe UI', sans-serif);
  font-size: var(--vscode-font-size, 13px);
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: min(1200px, 96vw);
  margin: 0 auto;
  padding: clamp(12px, 2vw, 20px);
  display: grid;
  /* minmax(0, …) lets wide result tables scroll inside their panel instead of widening the page. */
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
}

.header h1 {
  margin: 0;
  font-size: 1.35em;
  font-weight: 600;
}

.header p {
  margin: 4px 0 0;
  color: var(--muted);
}

h2 {
  margin: 0;
  font-size: 1.05em;
  font-weight: 600;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: clamp(12px, 2vw, 18px);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.row,
.grid > div {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

label,
legend {
  color: var(--muted);
}

select,
textarea,
input {
  border: 1px solid var(--input-border);
  border-radius: 4px;
  padding: 5px 8px;
  font: inherit;
  background: var(--input-bg);
  color: var(--input-text);
  min-width: 0;
}

textarea {
  font-family: var(--mono);
  resize: vertical;
}

select:focus,
textarea:focus,
input:focus,
button:focus-visible,
summary:focus-visible {
  outline: 1px solid var(--focus);
  outline-offset: 1px;
}

.grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}

.paging-grid {
  grid-template-columns: repeat(auto-fit, minmax(140px, 200px));
  margin-top: 10px;
}

.inline-control {
  display: flex;
  gap: 6px;
}

.inline-control select {
  flex: 1;
}

/* Buttons */
button,
summary.secondary {
  border: 1px solid transparent;
  border-radius: 4px;
  background: var(--accent);
  color: var(--accent-text);
  padding: 5px 12px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}

button:hover:not(:disabled) {
  background: var(--accent-strong);
}

button:disabled {
  opacity: 0.5;
  cursor: default;
}

button.secondary,
summary.secondary {
  background: var(--secondary);
  color: var(--secondary-text);
}

button.secondary:hover:not(:disabled),
summary.secondary:hover {
  background: var(--secondary-hover);
}

button.small {
  padding: 2px 8px;
}

button.link {
  background: none;
  color: var(--link);
  padding: 0 4px;
}

button.link:hover:not(:disabled) {
  background: none;
  text-decoration: underline;
}

button.link.danger {
  color: var(--error);
}

button.icon {
  background: none;
  color: var(--muted);
  padding: 0 8px;
  font-size: 1.2em;
  line-height: 1;
}

button.icon:hover:not(:disabled) {
  background: var(--row-hover);
  color: var(--text);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 12px 0 6px;
}

/* Dropdown menus built on <details> */
details.menu {
  position: relative;
}

details.menu > summary {
  list-style: none;
  user-select: none;
}

details.menu > summary::-webkit-details-marker {
  display: none;
}

details.menu > summary::after {
  content: ' ▾';
}

.menu-items {
  position: absolute;
  z-index: 10;
  top: calc(100% + 4px);
  left: 0;
  min-width: 220px;
  max-width: min(320px, calc(100vw - 32px));
  display: flex;
  flex-direction: column;
  padding: 4px;
  background: var(--vscode-menu-background, var(--panel));
  color: var(--vscode-menu-foreground, var(--text));
  border: 1px solid var(--vscode-menu-border, var(--border));
  border-radius: 6px;
  box-shadow: 0 4px 16px var(--vscode-widget-shadow, rgba(0, 0, 0, 0.2));
}

.menu-items button {
  background: none;
  color: inherit;
  text-align: left;
  font-weight: normal;
  padding: 5px 10px;
  white-space: normal;
}

.menu-items button:hover:not(:disabled),
.menu-items button:focus-visible {
  background: var(--vscode-menu-selectionBackground, var(--accent));
  color: var(--vscode-menu-selectionForeground, var(--accent-text));
}

.menu-toggle {
  padding: 6px 10px 4px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin: 6px 0 12px;
}

.tabs.compact {
  border-bottom: none;
  margin: 0;
}

.tabs [role='tab'] {
  background: none;
  color: var(--muted);
  border-radius: 0;
  border-bottom: 2px solid transparent;
  padding: 6px 12px;
}

.tabs [role='tab']:hover:not(:disabled) {
  background: none;
  color: var(--text);
}

.tabs [role='tab'][aria-selected='true'] {
  color: var(--text);
  border-bottom-color: var(--focus);
}

/* Form editor */
.hint {
  color: var(--muted);
  margin-bottom: 8px;
}

.hint.error {
  color: var(--error);
}

.request-list {
  display: grid;
  gap: 10px;
  margin-bottom: 10px;
}

.request-card,
.sort-editor {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px 10px;
  margin: 0;
}

.sort-editor {
  margin-top: 12px;
}

.criterion-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}

.criterion-field,
.sort-field {
  flex: 2 1 160px;
}

.criterion-row select {
  flex: 1 1 130px;
}

.criterion-value {
  flex: 2 1 120px;
}

.sort-editor .criterion-row {
  max-width: 560px;
}

.request-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-top: 4px;
}

.toggle {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}

/* Status */
.status {
  margin: 0;
  color: var(--muted);
  min-height: 1.4em;
}

.status.error {
  color: var(--error);
  font-weight: 600;
}

/* Results */
.results-header,
.results-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.results-toolbar {
  margin: 8px 0;
}

.summary {
  color: var(--muted);
}

.pager {
  display: flex;
  gap: 6px;
}

.empty {
  color: var(--muted);
}

.table-scroll-wrapper {
  width: 100%;
  overflow-x: auto;
}

.virtual-wrap {
  height: 420px;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  border: 1px solid var(--border);
  text-align: left;
  padding: 4px 8px;
  max-width: 320px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--header-bg);
  padding: 0;
}

th.actions-col {
  padding: 4px 8px;
}

.sort-header {
  width: 100%;
  background: none;
  color: var(--text);
  text-align: left;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 0;
}

.sort-header:hover:not(:disabled) {
  background: var(--row-hover);
}

.sort-indicator {
  color: var(--muted);
}

.results-table tbody tr:not(.spacer):hover {
  background: var(--row-hover);
}

td.actions-col {
  width: 1%;
  white-space: nowrap;
}

.raw {
  font-family: var(--mono);
  background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background, #ffffff));
  color: var(--text);
  padding: 12px;
  border-radius: 6px;
  overflow: auto;
  max-height: 420px;
}

/* History */
.history-panel > summary {
  cursor: pointer;
  list-style-position: inside;
  min-height: 24px; /* a comfortable target at every zoom level */
}

.history-panel > summary h2 {
  display: inline;
}

.history {
  overflow: auto;
  margin-top: 10px;
}

/* Loading */
.loading-skeleton {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.loading-skeleton .skeleton-line {
  height: 16px;
  background: var(--vscode-editor-inactiveSelectionBackground, rgba(208, 215, 222, 0.9));
  border-radius: 4px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}

.loading-skeleton .skeleton-line.short {
  width: 40%;
}

.loading-skeleton .skeleton-line.medium {
  width: 65%;
}

.loading-skeleton .skeleton-line.long {
  width: 90%;
}

@keyframes skeleton-pulse {
  0%,
  100% {
    opacity: 0.4;
  }

  50% {
    opacity: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  .loading-skeleton .skeleton-line {
    animation: none;
  }
}

.loading-skeleton.hidden,
.hidden {
  display: none;
}

@media (max-width: 700px) {
  .container {
    padding: 10px;
  }
}

.fm-version {
  margin: 12px 16px;
  font-size: 11px;
  color: var(--vscode-descriptionForeground, #5f6c7b);
}

/* A closed menu has no boxes at all (nothing to overflow or cover), and on a narrow panel an open one
   opens in the flow of the page instead of floating over it. */
details.menu:not([open]) > .menu-items {
  display: none;
}

@media (max-width: 700px) {
  details.menu[open] {
    flex: 1 0 100%;
  }

  /* Bound to the window, not to the page: a page that a wide control stretches must not stretch the menu. */
  details.menu > .menu-items {
    position: static;
    width: min(100%, calc(100vw - 48px));
    min-width: 0;
    max-width: none;
    margin-top: 6px;
    box-shadow: none;
  }
}

/* Narrow editors (a split editor, a narrow window, high zoom): nothing is wider than the panel.
   A long layout name must not widen a <select>: it is clipped with an ellipsis and its full text is
   in the option's tooltip. */
select,
input:not([type='checkbox']):not([type='radio']),
textarea {
  max-width: 100%;
  min-width: 0;
}

select {
  width: 100%;
  text-overflow: ellipsis;
}

.container,
.panel,
.row,
.field,
.actions,
.header {
  min-width: 0;
}

.actions,
.inline-actions {
  flex-wrap: wrap;
}

.status,
.summary,
td,
th,
code,
label {
  overflow-wrap: anywhere;
}

pre {
  max-width: 100%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

button {
  max-width: 100%;
  white-space: normal;
}

@media (max-width: 640px) {
  /* A menu that opens below a button would run off a narrow panel: open it in the flow instead. */
  .menu-items {
    position: static;
    min-width: 0;
    margin-top: 4px;
  }

  details.menu[open] {
    flex: 1 1 100%;
  }
}

/* Find values use the shared field form; action controls remain in the same row. */
.criterion-row.fm-fields { display: flex; margin-bottom: var(--fm-row-gap); align-items: flex-end; }
.criterion-row.fm-fields > .fm-field { flex: 0 1 var(--fm-field-width); }
@media (max-width: 640px) {
  .criterion-row.fm-fields { align-items: flex-start; }
  .criterion-row.fm-fields > .fm-field { flex: none; }
}

/* Theme colors are paired; HC outlines do not change control geometry. */
input, select, textarea {
  background: var(--vscode-input-background, #ffffff);
  color: var(--vscode-input-foreground, #333333);
  border-color: var(--vscode-contrastBorder, var(--vscode-input-border, var(--border)));
  accent-color: var(--vscode-focusBorder, #007acc);
}
button, summary {
  outline: 1px solid var(--vscode-contrastBorder, transparent);
}
button:hover, summary:hover {
  outline-color: var(--vscode-contrastActiveBorder, var(--vscode-contrastBorder, transparent));
}
input:focus-visible, select:focus-visible, textarea:focus-visible,
button:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--vscode-contrastActiveBorder, var(--vscode-focusBorder, #007acc));
  outline-offset: 1px;
}
a:any-link { color: var(--vscode-textLink-foreground, #005fb8); }

/* Native placeholder defaults are OS-dependent; keep hints readable. */
input::placeholder, textarea::placeholder {
  color: var(--vscode-input-foreground, #333333);
  opacity: 1;
}

</style></head><body class="vscode-light"><div class="container">
    <header class="header">
      <h1>FileMaker Query Builder</h1>
      <p>Build a find request, run it, and open any record from the results.</p>
    </header>

    <section class="panel" aria-labelledby="queryHeading">
      <h2 id="queryHeading" class="visually-hidden">Query</h2>
      <div class="grid source-grid">
        <div>
          <label for="profileSelect">Profile</label>
          <select id="profileSelect"><option>Customers</option></select>
        </div>
        <div>
          <label for="layoutSelect">Layout</label>
          <select id="layoutSelect"><option>Customers</option></select>
        </div>
        <div>
          <label for="savedQueriesSelect">Saved query</label>
          <div class="inline-control">
            <select id="savedQueriesSelect"><option>Customers</option></select>
            <button id="loadSavedButton" type="button" class="secondary">Load</button>
          </div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Query editor">
        <button id="formTab" type="button" role="tab" aria-selected="true" aria-controls="formEditor">Form</button>
        <button id="jsonTab" type="button" role="tab" aria-selected="false" aria-controls="jsonEditor" tabindex="-1">JSON</button>
      </div>

      <div id="formEditor" role="tabpanel" aria-labelledby="formTab">
        <datalist id="fieldNameOptions"></datalist>
        <div id="fieldNamesHint" class="hint"></div>
        <div id="requestList" class="request-list"></div>
        <button id="addRequestButton" type="button" class="secondary">Add request (OR)</button>
        <fieldset class="sort-editor">
          <legend>Sort</legend>
          <div id="sortList"></div>
          <button id="addSortButton" type="button" class="secondary">Add sort field</button>
        </fieldset>
      </div>

      <div id="jsonEditor" role="tabpanel" aria-labelledby="jsonTab" class="hidden">
        <div class="row">
          <label for="findJson">Find JSON (array of requests)</label>
          <textarea id="findJson" rows="6" spellcheck="false">[{}]</textarea>
        </div>
        <div class="row">
          <label for="sortJson">Sort JSON (optional array)</label>
          <textarea id="sortJson" rows="3" spellcheck="false"></textarea>
        </div>
      </div>

      <div class="grid paging-grid">
        <div>
          <label for="limitInput">Records per page</label>
          <input id="limitInput" type="number" min="1" placeholder="100">
        </div>
        <div>
          <label for="offsetInput">Start at record</label>
          <input id="offsetInput" type="number" min="1" placeholder="1">
        </div>
      </div>

      <div class="actions">
        <button id="runButton" type="button" title="Run query (Ctrl/Cmd+Enter)">Run</button>
        <button id="saveButton" type="button" class="secondary" title="Save this query (asks for a name)">Save…</button>
        <details class="menu" id="exportMenu">
          <summary class="secondary">Export</summary>
          <div class="menu-items">
            <button id="copyTableButton" type="button">Copy results as table</button>
            <button id="exportCsvButton" type="button">Save results as CSV…</button>
            <button id="exportJsonButton" type="button">Save results as JSON…</button>
            <button id="exportEditorButton" type="button">Open results in editor</button>
          </div>
        </details>
        <details class="menu" id="copyRequestMenu">
          <summary class="secondary">Copy request</summary>
          <div class="menu-items">
            <button id="copyCurlButton" type="button" data-copy-format="curl">Copy as curl</button>
            <button id="copyFetchButton" type="button" data-copy-format="fetch">Copy as fetch()</button>
            <button id="copyHttpButton" type="button" data-copy-format="http">Copy as .http (REST Client)</button>
            <button id="copyPostmanButton" type="button" data-copy-format="postman">Copy as Postman collection</button>
            <button id="copyTypeScriptButton" type="button" data-copy-format="typescript">Copy as TypeScript</button>
            <button id="saveHttpButton" type="button" data-copy-format="http" data-copy-destination="editor" title="Opens the request in a new editor. Save it where you want.">Save as .http file…</button>
            <label class="toggle menu-toggle"><input id="includeAuthCheckbox" type="checkbox"> Include auth header</label>
          </div>
        </details>
        <button id="uploadContainerButton" type="button" class="secondary">Upload to container…</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Ready</p>
    </section>

    <section class="panel" aria-labelledby="resultsHeading">
      <div class="results-header">
        <h2 id="resultsHeading">Results</h2>
        <div class="tabs compact" role="tablist" aria-label="Results view">
          <button id="tableViewTab" type="button" role="tab" aria-selected="true" aria-controls="tableContainer">Table</button>
          <button id="rawViewTab" type="button" role="tab" aria-selected="false" aria-controls="rawContainer" tabindex="-1">JSON</button>
        </div>
      </div>
      <div class="results-toolbar">
        <div id="resultSummary" class="summary" role="status" aria-live="polite"></div>
        <div class="pager">
          <button id="prevButton" type="button" class="secondary" disabled="">Previous page</button>
          <button id="nextButton" type="button" class="secondary" disabled="">Next page</button>
        </div>
      </div>
      <div id="tableContainer" class="table-wrap" role="tabpanel" aria-labelledby="tableViewTab"></div>
      <pre id="rawContainer" class="raw hidden" role="tabpanel" aria-labelledby="rawViewTab">{ "Name": "Ada Lovelace" }</pre>
    </section>

    <details class="panel history-panel">
      <summary><h2>Request history</h2></summary>
      <div id="historyContainer" class="history"></div>
    </details>
  </div>

  
  
  
  
  
<section class="panel"><p class="status error">Example error: connection refused</p><a href="#">Help</a><button class="secondary">Secondary</button><details class="menu" open=""><summary>Copy request</summary><div class="menu-items"><button>Copy as curl</button></div></details></section><footer class="fm-version">FileMaker Data API Tools v1.6.0</footer></body></html>
