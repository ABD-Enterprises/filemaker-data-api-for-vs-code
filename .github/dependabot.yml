version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 30
      include:
        - axios
        - next
        - react
        - react-dom
        - zod
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # uuid >=9 has a breaking ESM-first redesign that the @vscode/vsce →
      # @azure/identity → @azure/msal-node transitive chain (still on uuid@^8
      # as of msal-node 5.1.4) cannot consume. Re-enable once msal-node
      # publishes a release that requires uuid >=9.
      - dependency-name: uuid
        update-types:
          - version-update:semver-major
      # @types/vscode must track the MINIMUM VS Code we support
      # (engines.vscode in extension/package.json), not the latest release.
      # `vsce package` hard-fails when @types/vscode > engines.vscode, so
      # auto-bumps here (e.g. 1.96 -> 1.120) break the package/publish CI.
      # Bump this only in lockstep with a deliberate engines.vscode raise.
      - dependency-name: "@types/vscode"
