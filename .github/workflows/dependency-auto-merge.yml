name: Dependency Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  dependabot-dev-deps:
    permissions:
      contents: write
      pull-requests: write
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ github.token }}

      # Only the trusted base supplies the local action in this pull_request_target job.
      - name: Checkout base for local actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Ensure GitHub CLI is available
        uses: ./.github/actions/ensure-gh

      - name: Enable auto-merge for safe dev dependencies
        if: |
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          "$RUNNER_TEMP/gh-cli/bin/gh" pr merge --auto --squash "$PR_URL"
