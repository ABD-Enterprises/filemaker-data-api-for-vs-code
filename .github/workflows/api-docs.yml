name: API Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # configure-pages only reads the Pages site; publishing and the OIDC
    # token belong to the deploy job.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # The extension imports the compiled shared package (dist/), which
      # npm ci does not produce; typedoc cannot resolve it without this.
      - name: Build shared package
        run: npm run build -w shared

      - name: Generate API Docs
        run: npm run docs:api

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Stage API Docs
        run: |
          mkdir -p pages/api
          touch pages/.nojekyll
          cp -R docs/api/. pages/api/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
