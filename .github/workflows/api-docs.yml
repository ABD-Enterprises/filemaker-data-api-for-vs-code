name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # configure-pages only reads the Pages site; publishing and the OIDC
    # token belong to the deploy job.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # The extension imports the compiled shared package (dist/), which
      # npm ci does not produce; typedoc cannot resolve it without this.
      - name: Build shared package
        run: npm run build -w shared

      - name: Generate API Docs
        run: npm run docs:api

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage Documentation
        run: |
          node tools/build-docs-site.mjs --out pages
          mkdir -p pages/api
          cp -R docs/api/. pages/api/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
