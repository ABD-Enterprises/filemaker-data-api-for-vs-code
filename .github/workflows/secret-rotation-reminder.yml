#
# Reminds about credential rotation. See docs/SECRETS.md for the policy and
# for the "Rotation calendar" table this workflow reads.
#
# The job parses the rotation calendar of docs/SECRETS.md with
# scripts/lib/secret-rotation.mjs. Every credential that is past due or due
# within the next 30 days gets a reminder: the workflow comments on the open
# issue labeled ops/secret-rotation that already tracks that credential, or
# opens one with a checklist when there is none.
#
# The workflow never reads a secret. It reads the calendar table, which holds
# names, owners and dates, and it writes issues with the job token
# (contents: read, issues: write).
#
# A manual run has a "dry-run" input, on by default: it prints what it would
# file and files nothing. The monthly run always files for real.
#
# Only one run files at a time (the concurrency group below), so two runs
# cannot race for the label or for the same reminder issue.
#
# The parser behind it implements #296.
#
name: Secret rotation reminder

on:
  schedule:
    # First of every month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Print what would be filed, without creating or commenting on any issue.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# One run at a time. Two runs would race on the label and on the same reminder
# issue, and the loser of that race would fail. The job is idempotent, so a
# run that arrives while another one is in flight waits instead of cancelling
# it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      # The parser and the runner have no dependencies, so the tests run
      # without an install step. The shell expands the glob: Node 22 reads a
      # directory argument as a module and fails, so the test files are named
      # one by one.
      - name: Test the rotation calendar parser
        shell: bash
        run: node --test scripts/*.test.mjs

      - name: Ensure GitHub CLI is available
        uses: ./.github/actions/ensure-gh

      - name: File rotation reminders
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_CLI: ${{ runner.temp }}/gh-cli/bin/gh
          # Empty on the scheduled run, so the scheduled run files for real.
          DRY_RUN: ${{ inputs.dry-run }}
        run: node scripts/secret-rotation-remind.mjs
