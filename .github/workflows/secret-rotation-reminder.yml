#
# Scaffolded reminder workflow — see docs/SECRETS.md for the policy.
#
# Currently a NO-OP: the parser that reads "Next rotation due" dates
# from docs/SECRETS.md is not implemented yet. The file exists so the
# scheduling slot is reserved and the docs reference resolves.
#
# When the parser lands, this workflow:
#   1. Reads the Tracked rotation calendar table
#   2. For each row where "Next rotation due" is within 30 days
#   3. Opens an issue labeled ops/secret-rotation with checklist
#
# Until then, the calendar reminder in the maintainer's own calendar
# is the source of truth. This workflow is a planned redundancy.
#
# Closes #142.
#
name: Secret rotation reminder

on:
  schedule:
    # First of every month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: No-op (parser not yet implemented)
        run: |
          echo "This workflow is a scaffold. See docs/SECRETS.md."
          echo "Until the parser lands, rotation is calendar-driven on the maintainer's side."
          echo "Skipping reminder generation."
