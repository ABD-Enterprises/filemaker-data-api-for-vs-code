name: Entra identity id

# Manual, one-time helper for docs/JOB_AID_ENTRA_PUBLISHING.md. It logs in as the managed identity
# (through the `marketplace` environment, so it waits for your approval) and prints the identity's
# Azure DevOps id, which you then add to the Marketplace publisher as a Contributor. The id is an
# identifier, not a secret.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-id:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Print the Azure DevOps id
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
