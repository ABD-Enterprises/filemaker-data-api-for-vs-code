name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

# Least-privilege default for every job. The publish job overrides this with
# the narrower write scope it actually needs; build-test and package are
# read-only. Explicit top-level permissions also satisfy CodeQL's
# actions/missing-workflow-permissions hardening rule.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      # The rotation calendar parser and the reminder runner have no
      # dependencies, so their tests run before anything is installed.
      # The shell expands the glob: Node 22 reads a directory argument as a
      # module and fails, so the test files are named one by one.
      - name: Test the rotation calendar parser
        shell: bash
        run: node --test scripts/*.test.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Workflow regression tests
        run: node --test .github/tests/ci.test.mjs

      # The extension imports the compiled shared package (dist/), which npm ci does not produce.
      - name: Build shared package
        run: npm run build -w shared

      - name: Mock API contract
        run: npm run mock:check -w extension

      - name: Typecheck
        run: npm run typecheck

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Test designer and runtime workspaces
        run: npm test -w designer-ui -w runtime-next

      - name: Package Validation
        run: npm run package:check

      - name: Enforce VSIX size budget
        env:
          # Hard ceiling on the VSIX produced by package:check. Bumping this
          # cap is a deliberate decision — open a PR that changes the
          # number, with a one-line rationale in the commit message
          # (e.g., "raising to 5 MB to accommodate webview chunk split").
          # See docs/BUNDLE_SIZE.md for the policy.
          VSIX_BUDGET_BYTES: '3145728'  # 3 MiB
        run: |
          VSIX_PATH="$(echo artifacts/*.vsix)"
          if [ ! -f "$VSIX_PATH" ]; then
            echo "::error::No VSIX found in artifacts/. package:check must produce one."
            exit 1
          fi
          ACTUAL=$(wc -c < "$VSIX_PATH" | tr -d ' ')
          echo "VSIX size: $ACTUAL bytes ($(echo "scale=2; $ACTUAL/1048576" | bc) MiB)"
          echo "Budget:    $VSIX_BUDGET_BYTES bytes ($(echo "scale=2; $VSIX_BUDGET_BYTES/1048576" | bc) MiB)"
          if [ "$ACTUAL" -gt "$VSIX_BUDGET_BYTES" ]; then
            echo "::error::VSIX exceeds the size budget. See docs/BUNDLE_SIZE.md for how to raise the cap intentionally vs. trim the bundle."
            exit 1
          fi

  # Real users run on Windows and Linux as well as macOS. This job builds and tests on the two
  # other desktop platforms. It is not a required check (branch protection requires only
  # `build-test`), so a platform-only failure is visible without blocking unrelated work. This
  # repository is public, so GitHub-hosted runners are free here; the self-hosted-only rule for
  # private repositories does not apply. Do not copy this runner choice into a private repository.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test designer and runtime workspaces
        run: npm test -w designer-ui -w runtime-next

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Package Validation
        run: npm run package:check

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Package Extension
        run: npm run package:vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-vsix
          path: artifacts/*.vsix

      # The shipped bundles are minified and carry no source map; the external maps from this very
      # build are kept as a release asset so a user-reported stack trace can be symbolicated.
      - name: Collect source maps
        run: |
          set -euo pipefail
          mkdir -p artifacts/maps
          shopt -s nullglob
          maps=(extension/dist/*.map)
          if [ "${#maps[@]}" -eq 0 ]; then
            echo "::error::No source maps were produced by the build; the release would have no symbolication asset."
            exit 1
          fi
          (cd extension/dist && tar -czf "../../artifacts/maps/sourcemaps-${GITHUB_REF_NAME}.tgz" ./*.map)

      - name: Upload source maps Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-sourcemaps
          path: artifacts/maps/*.tgz

  # Marketplace publishing is its own job so that nothing from the project's dependency tree runs
  # where the Azure login exists, and so that the repository write scope is not present. It runs
  # only for a tag that points at a commit on main whose version matches the tag, and it waits for
  # the `marketplace` environment (required reviewer).
  #
  # Authentication is Microsoft Entra ID, not a personal access token: GitHub issues a short-lived
  # OIDC token, azure/login exchanges it for the managed identity `AZURE_CLIENT_ID`, and vsce
  # publishes with --azure-credential. The federated credential is tied to the `marketplace`
  # environment, so no other job or branch can obtain it. One-time setup:
  # docs/JOB_AID_ENTRA_PUBLISHING.md.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Require a release tag on main that matches the version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main; refusing to publish."
            exit 1
          fi
          VERSION="$(node -p "require('./extension/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension/package.json version $VERSION."
            exit 1
          fi

      - name: Download VSIX Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-vsix
          path: artifacts

      # Project dependencies and their install scripts never run in this job. vsce comes from its
      # own minimal lockfile (tools/publish), installed without lifecycle scripts, before the
      # Azure login exists.
      - name: Install vsce from its lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/publish

      - name: Require the Azure identity settings
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::AZURE_CLIENT_ID and AZURE_TENANT_ID must be set on the marketplace environment. See docs/JOB_AID_ENTRA_PUBLISHING.md."
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

      - name: Log in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Marketplace
        run: |
          VSIX_PATH="$(realpath artifacts/*.vsix)"
          tools/publish/node_modules/.bin/vsce publish --packagePath "$VSIX_PATH" --no-update-package-json --azure-credential

  # Runs only after `publish` succeeded, which already required the tag to be on main and to match
  # the version; it does not repeat those checks.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download VSIX Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-vsix
          path: artifacts

      - name: Download source maps Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-sourcemaps
          path: artifacts/maps

      - name: Ensure GitHub CLI is available
        uses: ./.github/actions/ensure-gh

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          VSIX_PATH="$(echo artifacts/*.vsix)"
          # Write the notes to a file first: if the script fails or finds no section, stop here
          # instead of creating a release with empty notes.
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          tools/release-notes.sh "$GITHUB_REF_NAME" > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::No release notes found for $GITHUB_REF_NAME in extension/CHANGELOG.md."
            exit 1
          fi
          "$RUNNER_TEMP/gh-cli/bin/gh" release create "$GITHUB_REF_NAME" "$VSIX_PATH" artifacts/maps/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE"
        env:
          GH_TOKEN: ${{ github.token }}
