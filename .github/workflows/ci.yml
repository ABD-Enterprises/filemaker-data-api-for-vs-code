name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:

# Least-privilege default for every job. The publish job overrides this with
# the narrower write scope it actually needs; build-test and package are
# read-only. Explicit top-level permissions also satisfy CodeQL's
# actions/missing-workflow-permissions hardening rule.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Package Validation
        run: npm run package:check

      - name: Enforce VSIX size budget
        env:
          # Hard ceiling on the VSIX produced by package:check. Bumping this
          # cap is a deliberate decision — open a PR that changes the
          # number, with a one-line rationale in the commit message
          # (e.g., "raising to 5 MB to accommodate webview chunk split").
          # See docs/BUNDLE_SIZE.md for the policy.
          VSIX_BUDGET_BYTES: '5242880'  # 5 MiB
        run: |
          VSIX_PATH="$(echo artifacts/*.vsix)"
          if [ ! -f "$VSIX_PATH" ]; then
            echo "::error::No VSIX found in artifacts/. package:check must produce one."
            exit 1
          fi
          ACTUAL=$(wc -c < "$VSIX_PATH" | tr -d ' ')
          echo "VSIX size: $ACTUAL bytes ($(echo "scale=2; $ACTUAL/1048576" | bc) MiB)"
          echo "Budget:    $VSIX_BUDGET_BYTES bytes ($(echo "scale=2; $VSIX_BUDGET_BYTES/1048576" | bc) MiB)"
          if [ "$ACTUAL" -gt "$VSIX_BUDGET_BYTES" ]; then
            echo "::error::VSIX exceeds the size budget. See docs/BUNDLE_SIZE.md for how to raise the cap intentionally vs. trim the bundle."
            exit 1
          fi

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Package Extension
        run: npm run package:vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-vsix
          path: artifacts/*.vsix

  # Marketplace publishing is its own job so that the VSCE_PAT secret is never present in a job
  # that installs project dependencies or has write access to the repository. It runs only for a
  # tag that points at a commit on main whose version matches the tag, and it waits for the
  # `marketplace` environment (set required reviewers on it in the repository settings).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    environment: marketplace
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Require a release tag on main that matches the version
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main; refusing to publish."
            exit 1
          fi
          VERSION="$(node -p "require('./extension/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension/package.json version $VERSION."
            exit 1
          fi

      - name: Download VSIX Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-vsix
          path: artifacts

      # No `npm ci` here: project dependencies and their install scripts must not run in the job
      # that holds the token. vsce is fetched at a pinned version and run from a clean directory.
      - name: Publish to Marketplace
        run: |
          VSIX_PATH="$(realpath artifacts/*.vsix)"
          cd "$RUNNER_TEMP"
          npx --yes @vscode/vsce@4.0.0 publish --packagePath "$VSIX_PATH" --no-update-package-json
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download VSIX Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-vsix
          path: artifacts

      # The self-hosted Linux runners do not ship the GitHub CLI. Place a gh
      # binary at a fixed job-scoped path: reuse one already on PATH, or
      # download the pinned release for the runner's architecture (no root
      # needed) and verify its published checksum. The consuming step calls
      # that path directly, so no GITHUB_PATH or GITHUB_ENV write is needed.
      - name: Ensure GitHub CLI is available
        run: |
          GH_VERSION=2.102.0
          GH_HOME="${RUNNER_TEMP}/gh-cli"
          mkdir -p "${GH_HOME}/bin"
          if command -v gh >/dev/null 2>&1; then
            ln -sf "$(command -v gh)" "${GH_HOME}/bin/gh"
          else
            case "$(uname -m)" in
              x86_64) GH_ARCH=amd64 ;;
              aarch64|arm64) GH_ARCH=arm64 ;;
              *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            ASSET="gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz"
            CHECKSUMS="gh_${GH_VERSION}_checksums.txt"
            BASE_URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
            curl -sSfL -o "${GH_HOME}/${ASSET}" "${BASE_URL}/${ASSET}"
            curl -sSfL -o "${GH_HOME}/${CHECKSUMS}" "${BASE_URL}/${CHECKSUMS}"
            (cd "${GH_HOME}" && grep " ${ASSET}$" "${CHECKSUMS}" | sha256sum -c -)
            tar -xzf "${GH_HOME}/${ASSET}" -C "${GH_HOME}" --strip-components=1 \
              "gh_${GH_VERSION}_linux_${GH_ARCH}/bin/gh"
          fi
          "${GH_HOME}/bin/gh" --version

      - name: Create GitHub Release
        run: |
          VSIX_PATH="$(echo artifacts/*.vsix)"
          tools/release-notes.sh "$GITHUB_REF_NAME" \
            | "$RUNNER_TEMP/gh-cli/bin/gh" release create "$GITHUB_REF_NAME" "$VSIX_PATH" \
                --title "$GITHUB_REF_NAME" \
                --notes-file -
        env:
          GH_TOKEN: ${{ github.token }}
