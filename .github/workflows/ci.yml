name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:

# Least-privilege default for every job. The publish job overrides this with
# the narrower write scope it actually needs; build-test and package are
# read-only. Explicit top-level permissions also satisfy CodeQL's
# actions/missing-workflow-permissions hardening rule.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Package Validation
        run: npm run package:check

      - name: Enforce VSIX size budget
        env:
          # Hard ceiling on the VSIX produced by package:check. Bumping this
          # cap is a deliberate decision — open a PR that changes the
          # number, with a one-line rationale in the commit message
          # (e.g., "raising to 5 MB to accommodate webview chunk split").
          # See docs/BUNDLE_SIZE.md for the policy.
          VSIX_BUDGET_BYTES: '5242880'  # 5 MiB
        run: |
          VSIX_PATH="$(echo artifacts/*.vsix)"
          if [ ! -f "$VSIX_PATH" ]; then
            echo "::error::No VSIX found in artifacts/. package:check must produce one."
            exit 1
          fi
          ACTUAL=$(wc -c < "$VSIX_PATH" | tr -d ' ')
          echo "VSIX size: $ACTUAL bytes ($(echo "scale=2; $ACTUAL/1048576" | bc) MiB)"
          echo "Budget:    $VSIX_BUDGET_BYTES bytes ($(echo "scale=2; $VSIX_BUDGET_BYTES/1048576" | bc) MiB)"
          if [ "$ACTUAL" -gt "$VSIX_BUDGET_BYTES" ]; then
            echo "::error::VSIX exceeds the size budget. See docs/BUNDLE_SIZE.md for how to raise the cap intentionally vs. trim the bundle."
            exit 1
          fi

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Package Extension
        run: npm run package:vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-vsix
          path: artifacts/*.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Download VSIX Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-vsix
          path: artifacts

      - name: Publish to Marketplace
        run: |
          VSIX_PATH="$(echo artifacts/*.vsix)"
          npx @vscode/vsce publish --packagePath "$VSIX_PATH" --no-update-package-json
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        run: |
          VSIX_PATH="$(echo artifacts/*.vsix)"
          tools/release-notes.sh "$GITHUB_REF_NAME" \
            | gh release create "$GITHUB_REF_NAME" "$VSIX_PATH" \
                --title "$GITHUB_REF_NAME" \
                --notes-file -
        env:
          GH_TOKEN: ${{ github.token }}
